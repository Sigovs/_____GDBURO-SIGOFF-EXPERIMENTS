<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Act 02 — V5 · Guided sales experience</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
/* ======================================================================================
   V5 — GUIDED SALES EXPERIENCE

   THE LEADER EXPERIMENT IS OVER.  Nothing is drawn above the model any more.  What
   lights up on hover is the BUILDING'S OWN PARAPET — the real roof edge, computed from
   the run's measured corners and projected every frame, with a light travelling once
   around it.  The architecture is the leader.  There is no line through empty space, so
   there is nothing left to read as a CAD annotation.

   TWO ESCAPES, AND THEY ARE DIFFERENT THINGS.
     ← OVERVIEW    the spatial home. One click, same place, always there once you have
                   left compound, Escape as well. Returns the authored compound camera.
     SITE PLAN     a utility mode, not a place. Its own fixed BACK TO 3D, Escape too, and
                   it restores the exact state it was opened from.

   THE DOCK GROWS ONLY WHEN IT HAS WORK.  At compound it is a small plate at the left.
   It becomes a full-width decision surface only once there is a building to decide about.
   ====================================================================================== */
:root{
  --void:#060708; --ground:#0A0B0D; --panel:#0B0D10; --panel2:#0E1114;
  --ink:#F2F4F6; --ink-85:rgb(242 244 246/.85); --ink-70:rgb(242 244 246/.70);
  --ink-55:rgb(242 244 246/.55); --ink-40:rgb(242 244 246/.40);
  --ink-24:rgb(242 244 246/.24); --ink-16:rgb(242 244 246/.16); --ink-10:rgb(242 244 246/.10);
  --red:#D8453C; --red-70:rgb(216 69 60/.70); --red-24:rgb(216 69 60/.24);
  --sand:#C9BCA8; --sand-70:rgb(201 188 168/.70); --sand-24:rgb(201 188 168/.24);
  --steel:#8FA4B4; --steel-40:rgb(143 164 180/.40); --steel-16:rgb(143 164 180/.16);
  --grot:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);overflow:hidden}
body{font-family:var(--grot);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.stage{position:fixed;inset:0;background:var(--ground);isolation:isolate}
.mount{position:absolute;inset:0}
.compound__svg{width:100%;height:100%;display:block;overflow:hidden}
.compound__gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage[data-hot='true'] .compound__gl{cursor:pointer}
.stage[data-gl='on'] .compound__svg{visibility:hidden}
.cal{display:none}
.stage::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,rgb(6 7 8/.58) 0%,rgb(6 7 8/0) 12%),
             linear-gradient(to top,rgb(6 7 8/.9) 0%,rgb(6 7 8/.4) 11%,rgb(6 7 8/0) 28%)}
.mark{position:absolute;z-index:6;top:var(--s6);left:var(--s7);display:grid;gap:var(--s1)}
.mark b{font-size:15px;font-weight:600;letter-spacing:.10em;text-transform:uppercase}
.mark span{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}

/* ---- THE PARAPET LIGHT — the building's own edge, not a line above it -------------- */
/* an inline SVG with no width/height falls back to 300x150 and clips everything drawn
   past it — the ring was being computed correctly and then cropped away */
#edge{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
#edge .ring{fill:none;stroke:var(--sand-70);stroke-width:2;vector-effect:non-scaling-stroke}
#edge .run{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
#edge[data-s='on'] .ring{stroke:var(--red)} #edge[data-s='on'] .run{stroke:var(--red)}
@keyframes travel{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
#edge .run{animation:travel .7s var(--ease) forwards}
@media (prefers-reduced-motion:reduce){#edge .run{animation:none;stroke-dashoffset:0;opacity:.6}}

/* ---- THE BUILDING TAB — grounded, close to the mass, and obviously pressable ------- */
#tab{position:absolute;z-index:5;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;
  background:var(--sand);color:var(--void);border:0;padding:0;text-align:left;font:inherit;
  box-shadow:0 0 0 1px rgb(0 0 0/.35)}
#tab[data-s='on']{background:var(--red);color:#fff}
#tab .n{display:block;font-family:var(--grot);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em;padding:9px 14px 4px}
#tab .m{display:block;font-family:var(--mono);font-size:14px;letter-spacing:.10em;text-transform:uppercase;padding:0 14px 7px;opacity:.78}
#tab .go{display:block;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  padding:7px 14px 6px;border-top:1px solid rgb(0 0 0/.28);background:rgb(0 0 0/.12)}
#tab::after{content:'';position:absolute;left:50%;bottom:-9px;width:1px;height:9px;background:var(--sand)}
#tab[data-s='on']::after{background:var(--red)}

/* ---- OVERVIEW — the global escape, one place, always the same ---------------------- */
.home{position:absolute;z-index:8;top:var(--s6);right:var(--s7);display:flex;gap:var(--s3)}
.home button{appearance:none;cursor:pointer;background:rgb(8 9 11/.72);border:1px solid var(--ink-40);color:var(--ink);
  font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  padding:10px 16px 9px;transition:background-color .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease)}
.home button:hover{background:var(--ink);color:var(--void);border-color:var(--ink)}
.home .ghost{background:none;border-color:var(--ink-24);color:var(--ink-55)}
.home .ghost:hover{background:none;border-color:var(--ink-70);color:var(--ink)}

/* ---- THE DECISION DOCK ------------------------------------------------------------- */
.dock{position:absolute;z-index:7;bottom:var(--s6);left:var(--s7);right:var(--s7);
  background:var(--panel);border:1px solid var(--ink-24);
  display:grid;grid-template-columns:auto 1fr auto;align-items:stretch}
/* at compound it is a small plate at the left, not a stripe across the screen */
.dock[data-level='compound']{right:auto;grid-template-columns:auto}
.dock::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--red)}
.cell{padding:var(--s4) var(--s5)}
.cell + .cell{border-left:1px solid var(--ink-16)}
.who__k{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-55)}
.who__f{font-size:38px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:var(--s2) 0 5px}
.who__s{font-size:16px;color:var(--ink-85)} .who__s b{color:var(--ink);font-weight:500}
.tell{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px 1px;margin-top:var(--s2)}
.chip--a{color:var(--void);background:var(--sand)} .chip--b{color:var(--steel);border:1px solid var(--steel-40)}

/* ---- MINIATURE GARAGE BAYS, at the real width ratio -------------------------------- */
.bays{display:flex;align-items:flex-end;gap:3px;padding:var(--s4) var(--s5) var(--s4)}
.bay{appearance:none;padding:0;position:relative;cursor:pointer;height:44px;
  background:var(--ink-10);border:1px solid var(--steel-16);border-bottom:2px solid var(--steel-40);
  transition:height .18s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease)}
.bay::after{content:'';position:absolute;left:3px;right:3px;top:4px;height:6px;background:var(--steel-40);transition:background-color .18s var(--ease)}
.bay::before{content:'';position:absolute;left:3px;right:3px;top:12px;bottom:3px;background:var(--steel-16);transition:background-color .18s var(--ease)}
.bay:hover,.bay[data-hot='true']{height:54px;background:var(--sand-24);border-color:var(--sand)}
.bay:hover::after,.bay[data-hot='true']::after{background:var(--sand)}
.bay:hover::before,.bay[data-hot='true']::before{background:var(--sand-70)}
.bay[data-sold='true']{cursor:not-allowed;height:28px;background:none;border-color:var(--ink-10);border-bottom-color:var(--ink-16)}
.bay[data-sold='true']::before,.bay[data-sold='true']::after{background:var(--ink-10)}
.bay[aria-pressed='true']{height:60px;background:var(--red-24);border-color:var(--red)}
.bay[aria-pressed='true']::before{background:var(--red)} .bay[aria-pressed='true']::after{background:#fff}
.bay__t{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;opacity:0;pointer-events:none;
  font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);background:rgb(8 9 11/.95);
  border:1px solid var(--ink-40);padding:3px 7px 2px;transition:opacity .15s var(--ease)}
.bay:hover .bay__t,.bay[data-hot='true'] .bay__t{opacity:1}
.bay[aria-pressed='true'] .bay__t{opacity:1;color:#fff;background:var(--red);border-color:var(--red)}
.bayscroll{overflow-x:auto;overflow-y:hidden}
.bayscroll::-webkit-scrollbar{height:0}

.right{display:flex;align-items:center;gap:var(--s5);padding:var(--s4) var(--s5)}
.price{display:grid;gap:1px}
.price .k{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.price .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.price .a{font-size:15px;color:var(--ink-55)}
.enter{appearance:none;cursor:pointer;display:grid;grid-template-columns:auto 52px;align-items:stretch;
  border:0;padding:0;font:inherit;background:var(--red);color:#fff;transition:filter .2s var(--ease)}
.enter:hover{filter:brightness(1.12)}
.enter .t{padding:16px var(--s5) 15px;text-align:left;font-size:18px;font-weight:600;letter-spacing:-.005em}
.enter .t i{display:block;font-style:normal;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.72;margin-bottom:2px}
.enter .a{display:flex;align-items:center;justify-content:center;font-size:20px;border-left:1px solid rgb(255 255 255/.3)}

/* ---- SITE PLAN --------------------------------------------------------------------- */
.plan{position:fixed;inset:0;z-index:30;background:var(--panel2);display:grid;grid-template-rows:auto 1fr}
.plan__bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s6);padding:var(--s4) var(--s7);border-bottom:1px solid var(--ink-24)}
.plan__exit{appearance:none;cursor:pointer;background:var(--ink);border:0;color:var(--void);
  font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:11px 18px 10px}
.plan__t{display:flex;align-items:baseline;gap:var(--s4)}
.plan__t b{font-size:19px;font-weight:600} .plan__t span{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.plan__key{display:flex;gap:var(--s5);font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}
.plan__key i{display:inline-block;width:22px;height:9px;margin-right:7px;font-style:normal}
.plan__grid{position:relative;display:grid;grid-template-columns:1fr 292px;overflow:hidden}
.plan__map{position:relative;overflow:hidden}
.plan__list{border-left:1px solid var(--ink-16);padding:var(--s5) var(--s6);overflow:auto}
.plan__list h4{margin:0 0 var(--s4);font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:baseline;width:100%;text-align:left;
  padding:10px 0;border:0;border-bottom:1px solid var(--ink-10);background:none;color:inherit;font:inherit;cursor:pointer}
.prow:hover{color:var(--sand)}
.prow b{font-family:var(--mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.prow span{font-size:15px;color:var(--ink-55)} .prow em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--ink-70)}
.plan__map svg{width:100%;height:100%;display:block;visibility:visible}
.plan__map .perimeter{fill:none;stroke:var(--ink-24);stroke-width:1.4;vector-effect:non-scaling-stroke}
.plan__map .mass-road-trace,.plan__map .compound__road{fill:#141a20;stroke:none}
.plan__map .mass-road-line{fill:none;stroke:var(--ink-16);stroke-width:1;vector-effect:non-scaling-stroke}
.plan__map .mass-run,.plan__map .mass-side{fill:#1b2129;stroke:var(--ink-16);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .mass-civic{fill:#2a323b;stroke:var(--ink-24);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .bay{stroke:rgb(10 12 15/.9);stroke-width:.6;vector-effect:non-scaling-stroke}
.plan__map .bay[data-type='A']{fill:var(--sand-70)}
.plan__map .bay[data-type='B']{fill:var(--steel-40)}
.plan__map .bay[data-sold='true']{fill:none;stroke:var(--ink-24)}
.plan__map .door{fill:none;stroke:var(--ink-40);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .leader,.plan__map .route{display:none}
.plan__map .pnum{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500;paint-order:stroke;stroke:rgb(6 7 8/.85);stroke-width:4px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mount" id="mount"></div>
  <svg id="edge" hidden><polyline class="ring"/><polyline class="run"/></svg>
  <button id="tab" type="button" hidden></button>

  <div class="mark"><b>Luxe&nbsp;Corsa</b><span>Lake Zurich, Illinois</span></div>
  <div class="home">
    <button class="ghost" id="planBtn" type="button">Site plan</button>
    <button id="overview" type="button" hidden>← Overview</button>
  </div>

  <div class="dock" id="dock" data-level="compound">
    <div class="cell" id="cellWho">
      <div class="who__k" id="whoK">Luxe Corsa</div>
      <div class="who__f" id="whoF">121</div>
      <div class="who__s" id="whoS">private suites · 11 buildings</div>
      <div class="tell" id="tell">Choose a building.</div>
    </div>
    <div class="cell bayscroll" id="cellBays" hidden><div class="bays" id="bays" role="group" aria-label="Suites"></div></div>
    <div class="cell right" id="cellRight" hidden></div>
  </div>
</div>

<div class="plan" id="plan" hidden>
  <div class="plan__bar">
    <button class="plan__exit" id="planExit" type="button">← Back to 3D</button>
    <div class="plan__t"><b>Site plan</b><span>11 buildings · 121 suites</span></div>
    <div class="plan__key">
      <span><i style="background:var(--sand)"></i>Premium — Type A</span>
      <span><i style="background:var(--steel-40)"></i>Standard — Type B</span>
      <span><i style="background:var(--ink-10)"></i>Sold</span>
    </div>
  </div>
  <div class="plan__grid"><div class="plan__map" id="planMap"></div><div class="plan__list" id="planList"><h4>Buildings</h4></div></div>
</div>

<script type="module">
import { buildCompound, TYPE_SPEC } from '/src/site/compound.js'
const $ = (id) => document.getElementById(id)
const stage=$('stage'), mount=$('mount'), dock=$('dock')
const compound = buildCompound(mount)
let gl=null, THREE=null
const S = { level:'compound', building:null, suite:null, hover:null, hoverSuite:null, plan:false }
const available = compound.suites.filter(s=>!s.sold).length
const say = v => String(v).replace(/\bSQ FT\b/g,'sq ft').replace(/\bTYPE\b/g,'Type').replace(/\bFROM\b/g,'from')
const kind = t => t==='A' ? 'Premium' : 'Standard'

function hoverBuilding(b){ if(S.hover===b) return; S.hover=b; gl?.setHoverBuilding(b?b.num:null)
  stage.dataset.hot = b && !S.building ? 'true' : 'false'; paint() }
function hoverSuite(s){ if(S.hoverSuite===s) return; S.hoverSuite=s; gl?.setHoverSuite(s||null); paint() }
function selectBuilding(b){ if(!b) return
  Object.assign(S,{building:b,suite:null,hover:null,hoverSuite:null,level:'building'})
  stage.dataset.hot='false'; gl?.setLevel('building',b.num); renderBays(); paint() }
function selectSuite(s){ if(!s||s.sold) return
  Object.assign(S,{suite:s,building:s.bldg,hoverSuite:null,level:'suite'})
  gl?.setLevel('suite',s.bldg.num,s.index); paint() }
/* THE GLOBAL ESCAPE. One action, one place, and it always means the same thing. */
function overview(){ Object.assign(S,{level:'compound',building:null,suite:null,hover:null,hoverSuite:null})
  stage.dataset.hot='false'; gl?.setLevel('compound'); paint() }
function backContext(){ if(S.level==='suite'&&S.building){ const b=S.building; S.suite=null; S.level='building'
  gl?.setLevel('building',b.num); paint() } else overview() }

/* ======================================================================================
   THE PARAPET LIGHT.  The roof outline of the subject, from the run's own measured
   corners, projected every frame. Nothing is drawn above the model.
   ====================================================================================== */
const edge=$('edge'), ringEl=edge.querySelector('.ring'), runEl=edge.querySelector('.run'), tab=$('tab')
const outlines = new Map()          /* num -> array of rings, each 4 world points */
let lastKey=null
/* the only correct way to toggle an SVG element that carries a hidden attribute */
const showEdge=(on)=>{ if(on) edge.removeAttribute("hidden"); else edge.setAttribute("hidden","") }

function buildOutlines(){
  for(const b of compound.buildings){
    const runs = new Map()
    for(const s of b.suites){ const k=s.ang.toFixed(2); if(!runs.has(k)) runs.set(k,[]); runs.get(k).push(s) }
    const rings=[]
    for(const list of runs.values()){
      const r=-(list[0].ang*Math.PI)/180, ux=Math.cos(r), uz=-Math.sin(r)
      const proj=list.map(s=>({s,u:s.cx*ux+s.cy*uz})).sort((a,b)=>a.u-b.u)
      const first=proj[0].s, last=proj[proj.length-1].s
      const halfA=(first.slot??first.w)/2, halfB=(last.slot??last.w)/2
      const d=(first.depth??first.dep)/2
      const nx=first.faceNormal[0], nz=first.faceNormal[1]
      const x0=first.cx-ux*halfA, z0=first.cy-uz*halfA
      const x1=last.cx+ux*halfB,  z1=last.cy+uz*halfB
      rings.push([[x0+nx*d,z0+nz*d],[x1+nx*d,z1+nz*d],[x1-nx*d,z1-nz*d],[x0-nx*d,z0-nz*d]])
    }
    outlines.set(b.num,rings)
  }
}
function drawEdge(){
  const subject = S.suite ? null : (S.building || S.hover)
  if(!gl||!subject||!outlines.size){ showEdge(false); tab.hidden=true; lastKey=null; return }
  const rings=outlines.get(subject.num); if(!rings) { showEdge(false); tab.hidden=true; return }
  const H = gl.roofY ?? 0
  const w=innerWidth, h=innerHeight
  /* SIZE THE SVG FROM SCRIPT. Left to CSS alone the element measured 0x0 in this
     document and every polyline drawn into it was clipped away — the ring was correct
     and invisible, which is the worst kind of wrong. Attributes, not a stylesheet. */
  if(edge.getAttribute("width")!==String(w)){ edge.setAttribute("width",w); edge.setAttribute("height",h); edge.setAttribute("viewBox","0 0 "+w+" "+h) }
  const pt=(x,z)=>{ const v=new THREE.Vector3(x,H,z); gl.site.localToWorld(v); v.project(gl.camera)
    return [(v.x*.5+.5)*w, (-v.y*.5+.5)*h, v.z] }
  let all=[], behind=false, sx=0, sy=0, n=0, top=1e9, topX=0
  const parts=[]
  for(const ring of rings){
    const p=ring.map(([x,z])=>pt(x,z))
    if(p.some(q=>q[2]>1)) behind=true
    const str=p.concat([p[0]]).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')
    parts.push(str); all=all.concat(p)
    for(const q of p){ sx+=q[0]; sy+=q[1]; n++; if(q[1]<top){ top=q[1]; topX=q[0] } }
  }
  if(behind||!n){ showEdge(false); tab.hidden=true; return }
  ringEl.setAttribute('points',parts[0]); runEl.setAttribute('points',parts[0])
  const len=2200; runEl.style.setProperty('--len',len); runEl.style.strokeDasharray=`${len*0.22} ${len}`
  const on=!!S.building
  edge.dataset.s = on?'on':'hover'; tab.dataset.s = on?'on':'hover'
  /* the tab sits just above the highest corner of the roof — attached, not floating */
  tab.style.left=Math.max(120,Math.min(w-140,topX))+'px'
  tab.style.top=Math.max(70,top-96)+'px'
  tab.innerHTML=`<span class="n">${subject.num}</span><span class="m">${subject.suites.length} suites · ${subject.open} available</span>`+
    (on?'':`<span class="go">View building →</span>`)
  showEdge(true); tab.hidden=false
  const key=subject.num+(on?'-on':'-hv')
  if(key!==lastKey){ lastKey=key; runEl.style.animation='none'; void runEl.offsetWidth; runEl.style.animation='' }
}
tab.addEventListener('click',()=>{ const b=S.hover||S.building; if(b&&!S.building) selectBuilding(b) })

/* ======================================================================================
   MINIATURE BAYS — at the model's own width ratio.
   ====================================================================================== */
const baysEl=$('bays')
function renderBays(){
  baysEl.replaceChildren()
  const list=S.building?.suites||[]
  const widest=Math.max(...list.map(s=>s.slot??s.w))
  for(const s of list){
    const b=document.createElement('button')
    b.type='button'; b.className='bay'; b.dataset.sold=s.sold?'true':'false'; b.dataset.type=s.type
    /* WIDTH COMES FROM THE MODEL, not from a style rule: a premium bay is 30/23 wider in
       the building and therefore 30/23 wider here. */
    b.style.width=Math.round(20+((s.slot??s.w)/widest)*18)+'px'
    b.setAttribute('aria-label',`Suite ${s.ref}, ${kind(s.type)}${s.sold?', sold':''}`)
    b.innerHTML=`<span class="bay__t">${s.ordinal} · ${kind(s.type)}</span>`
    b.addEventListener('pointerenter',()=>hoverSuite(s))
    b.addEventListener('pointerleave',()=>hoverSuite(null))
    b.addEventListener('focus',()=>hoverSuite(s))
    b.addEventListener('click',()=>selectSuite(s))
    b._s=s; baysEl.appendChild(b)
  }
}

/* ====================================================================================== */
const whoK=$('whoK'),whoF=$('whoF'),whoS=$('whoS'),tell=$('tell')
const cellBays=$('cellBays'),cellRight=$('cellRight'),ov=$('overview'),planBtn=$('planBtn')
function chip(t){ return `<span class="chip chip--${t.toLowerCase()}">${kind(t)} · Type ${t}</span>` }

function paint(){
  dock.dataset.level=S.level
  const b=S.building, s=S.suite
  ov.hidden = S.level==='compound'
  planBtn.hidden = S.level!=='compound'
  cellBays.hidden = S.level==='compound'
  cellRight.hidden = S.level==='compound'

  if(S.level==='suite'&&s){
    const t=TYPE_SPEC[s.type]
    whoK.textContent='Suite'; whoF.textContent=s.ref
    whoS.innerHTML=`Building ${b.num} · <b>available</b>`
    tell.innerHTML=chip(s.type)
    cellRight.innerHTML=`<div class="price"><span class="k">From</span><span class="v">${t.price.replace('FROM ','')}</span><span class="a">${say(t.total)}</span></div>
      <button class="enter" type="button"><span class="t"><i>Next</i>Enter suite ${s.ref}</span><span class="a">→</span></button>`
  } else if(S.level==='building'&&b){
    const hs=S.hoverSuite
    whoK.textContent='Building'; whoF.textContent=b.num
    whoS.innerHTML=`${b.suites.length} suites · <b>${b.open} available</b>`
    tell.textContent = hs ? '' : 'Choose a suite.'
    if(hs) tell.innerHTML=`${hs.ordinal} — ${chip(hs.type)}`
    cellRight.innerHTML = hs
      ? `<div class="price"><span class="k">${kind(hs.type)}</span><span class="v" style="font-size:20px">${say(TYPE_SPEC[hs.type].total)}</span><span class="a">${TYPE_SPEC[hs.type].price.replace('FROM ','')}</span></div>`
      : `<div class="price"><span class="k">Next</span><span class="v" style="font-size:19px">Choose a suite</span><span class="a">Each bay is one garage suite</span></div>`
  } else {
    const h=S.hover
    whoK.textContent='Luxe Corsa'; whoF.textContent=h?h.num:String(available)
    whoS.innerHTML=h?`${h.suites.length} suites · <b>${h.open} available</b>`:'private suites · 11 buildings'
    tell.textContent=h?'Click to open it.':'Choose a building.'
  }
  for(const el of baysEl.children){
    el.setAttribute('aria-pressed',el._s===s?'true':'false')
    if(el._s===S.hoverSuite&&el._s!==s) el.setAttribute('data-hot','true'); else el.removeAttribute('data-hot')
  }
  drawEdge()
}
ov.addEventListener('click',overview)
addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(S.plan) closePlan(); else if(S.level!=='compound') overview() })

/* ---- SITE PLAN --------------------------------------------------------------------- */
const planEl=$('plan'),planMap=$('planMap'),planList=$('planList'); let planBuilt=false
function buildPlan(){ if(planBuilt) return; planBuilt=true
  const svgEl=compound.svg.cloneNode(true)
  svgEl.style.width='100%'; svgEl.style.height='100%'; svgEl.style.visibility='visible'
  planMap.appendChild(svgEl)
  const NS='http://www.w3.org/2000/svg'
  for(const b of compound.buildings){
    const src=svgEl.querySelector('g[data-building="'+b.num+'"]')
    if(src){ const bb=src.getBBox(); const t=document.createElementNS(NS,'text')
      t.textContent=b.num; t.setAttribute('x',bb.x+bb.width/2); t.setAttribute('y',bb.y+bb.height/2)
      t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle'); t.setAttribute('class','pnum')
      svgEl.appendChild(t) }
    const row=document.createElement('button'); row.type='button'; row.className='prow'
    const a=b.suites.filter(x=>x.type==='A').length
    row.innerHTML=`<b>${b.num}</b><span>${b.suites.length} suites${a?` · ${a} premium`:''}</span><em>${b.open} free</em>`
    row.addEventListener('click',()=>{ closePlan(); selectBuilding(b) })
    planList.appendChild(row)
  }
}
function openPlan(){ buildPlan(); S.plan=true; planEl.hidden=false }
function closePlan(){ S.plan=false; planEl.hidden=true; paint() }
planBtn.addEventListener('click',openPlan)
$('planExit').addEventListener('click',closePlan)

/* ---- THE MODEL ---------------------------------------------------------------------- */
import('/src/site/compound3d.js').then(async ({ initCompound3D })=>{
  gl=initCompound3D(mount,compound); if(!gl) throw new Error('no webgl')
  stage.setAttribute('data-gl','on')
  THREE=await import('three')
  const bldgOf=n=>compound.byNum.get(n)
  gl.onHoverBuilding=n=>hoverBuilding(n?bldgOf(n):null)
  gl.onHoverSuite=i=>hoverSuite(i==null?null:compound.suites[i])
  gl.onPickBuilding=n=>{ const b=bldgOf(n); if(b) selectBuilding(b) }
  gl.onPickSuite=i=>{ const s=compound.suites[i]; if(s) selectSuite(s) }
  buildOutlines()
  /* the parapet height, read off a real roof rather than assumed */
  let hi=0; gl.site.traverse(o=>{ if(o.isMesh&&o.userData?.kind==='suite'){
    const bb=new THREE.Box3().setFromObject(o); if(bb.max.y>hi) hi=bb.max.y } })
  gl.roofY = hi / (gl.site.scale.y || 1)
  window.__v5={S,compound,selectBuilding,selectSuite,hoverBuilding,hoverSuite,overview,backContext,openPlan,closePlan,gl}
  const tick=()=>{ requestAnimationFrame(tick); drawEdge() }
  requestAnimationFrame(()=>{ gl.setLevel('compound'); paint(); tick() })
}).catch(e=>console.warn('[v5] model did not stand',e))
paint()
</script>
