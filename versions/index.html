<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — versions</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0c0d%27/%3E%3Crect x=%271%27 y=%277.5%27 width=%2714%27 height=%271%27 fill=%27%23f2903f%27/%3E%3C/svg%3E">
<style>
/*
  The version index. Not a page of the work — the door to it — so it is
  deliberately the quietest thing in the repository: a list, a rule between
  entries, and the same palette and mono the study itself uses so the door and
  the room are recognisably one building.

  No cards. Five variants in five bordered boxes would be five equal masses
  claiming equal rank, and they do not have it — the newest is the one being
  looked at (D4, DNA34: a hairline and a mono label buy the same structure at a
  fraction of the visual cost).
*/
:root {
  --ground:      #0a0c0d;
  --ground-lift: #121517;
  --ink:         #f2f4f5;
  --ink-muted:   #9aa3a7;
  --ink-dim:     #7d868a;   /* clears AA at 14px on both grounds — measured */
  --accent:      #f2903f;
  --rule:        #23282b;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Helvetica Neue", Helvetica, Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --gutter: clamp(1.5rem, 5vw, 5rem);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: clamp(2.5rem, 7vw, 6rem) var(--gutter) 6rem;
  background: var(--ground);
  color: var(--ink);
  font: 400 1rem/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent); color: var(--ground); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.wrap { max-width: 62rem; margin: 0 auto; }

.eyebrow {
  margin: 0 0 1.25rem;
  font: 500 0.875rem/1 var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
}

h1 {
  margin: 0 0 0.5rem;
  font: 600 clamp(2.25rem, 6vw, 4.25rem)/0.98 var(--sans);
  letter-spacing: -0.025em;
}

.subject {
  margin: 0 0 4rem;
  font: 400 0.875rem/1.5 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* ── the list ─────────────────────────────────────────────────────────── */

.variants { display: grid; }

.variant {
  display: grid;
  grid-template-columns: 7.5rem 1fr;
  gap: 0 2.5rem;
  padding: 2.25rem 0;
  border-top: 1px solid var(--rule);
}
.variant:last-child { border-bottom: 1px solid var(--rule); }

.variant__meta {
  font: 400 0.875rem/1.5 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.variant__status { display: block; color: var(--accent); }
.variant__status:empty { display: none; }

.variant__name {
  margin: 0 0 0.5rem;
  font: 600 clamp(1.5rem, 2.6vw, 2rem)/1.15 var(--sans);
  letter-spacing: -0.015em;
}

.variant__note {
  margin: 0 0 1.25rem;
  max-width: 46ch;
  color: var(--ink-muted);
  font-size: 0.9375rem;
}

/* The links are the point of the page, so they are the only thing on it with
   any weight. One row, no buttons: a filled control repeated down a list is
   wallpaper by the third entry (D6). */
.variant__links { display: flex; flex-wrap: wrap; gap: 0 2rem; }

.variant__links a {
  display: inline-flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.35rem 0;
  color: var(--ink);
  text-decoration: none;
  font: 500 0.875rem/1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--rule);
  transition: color 200ms cubic-bezier(0.22,1,0.36,1),
              border-color 200ms cubic-bezier(0.22,1,0.36,1);
}
.variant__links a::after { content: "\2192"; color: var(--accent); }
.variant__links a:hover { color: var(--accent); border-bottom-color: var(--accent); }

.variant--gone .variant__name,
.variant--gone .variant__note { color: var(--ink-dim); }
.variant--gone .missing {
  font: 400 0.875rem/1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

footer {
  margin-top: 4rem;
  padding-top: 1.75rem;
  border-top: 1px solid var(--rule);
  font: 400 0.875rem/1.6 var(--mono);
  letter-spacing: 0.05em;
  color: var(--ink-dim);
}
footer a { color: var(--ink-muted); }

@media (max-width: 640px) {
  .variant { grid-template-columns: 1fr; gap: 0.75rem; }
  .variant__meta { display: flex; gap: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Buro Lab</p>
  <h1>{{TITLE}}</h1>
  <p class="subject">{{SUBJECT}}</p>

  <div class="variants">
{{VARIANTS}}
  </div>

  <footer>
    <p>{{COUNT}} · built {{BUILT}} · <a href="{{REPO}}">source</a></p>
  </footer>

</div>
</body>
</html>
