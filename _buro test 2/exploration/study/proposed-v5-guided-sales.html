<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Act 02 — V5.2 · Guided sales experience</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
/* ======================================================================================
   V5.2 — GUIDED SALES EXPERIENCE

   WHAT CHANGED IN THIS PASS, and each one is a fix to something that failed a real test:

   THE TAG NO LONGER TAKES THE POINTER.  It was an interactive element floating over the
   canvas, so reaching for "View building" moved the cursor off the model, cleared the
   hover, hid the tag and left the pointer over nothing.  Measured, that is why buildings
   07 and 08 could not be selected: their tag lands exactly where the pointer has to be.
   The BUILDING is the button now — the whole mass, with cursor:pointer on it — and the
   tag is a label that never intercepts anything.

   THE DOCK IS A CONTROL SURFACE, not a caption.  It carries one job per level: at
   compound it is a small plate that says what this is and what to do; at building the
   suite selector takes the middle and dominates; at suite the product and ENTER take the
   right and dominate.

   THE MINIATURE BAYS ARE GARAGE UNITS.  Head, glazed upper panel, door leaf with its own
   segment lines, pier between neighbours, apron under them — and their WIDTHS come from
   the model, so a premium bay is 30:23 wider here exactly as it is in the building.
   Nothing changes height on hover: a row that grows is a drawer, and a drawer is the
   effect this pass was told to stop making.

   TWO ESCAPES, AND THEY ARE DIFFERENT THINGS.
     ← OVERVIEW    the spatial home. One click, same place, always there once you have
                   left compound, Escape as well. Returns the solved compound camera.
     SITE PLAN     a utility, not a place. Fit to the whole site on open, its own fixed
                   BACK TO 3D, Escape too, and it restores the exact state it opened from.
   ====================================================================================== */
:root{
  --void:#060708; --ground:#0A0B0D; --panel:#0B0D10; --panel2:#0E1114;
  --ink:#F2F4F6; --ink-85:rgb(242 244 246/.85); --ink-70:rgb(242 244 246/.70);
  --ink-55:rgb(242 244 246/.55); --ink-40:rgb(242 244 246/.40);
  --ink-24:rgb(242 244 246/.24); --ink-16:rgb(242 244 246/.16); --ink-10:rgb(242 244 246/.10);
  --red:#D8453C; --red-80:rgb(216 69 60/.80); --red-40:rgb(216 69 60/.40); --red-16:rgb(216 69 60/.16);
  --sand:#C9BCA8; --sand-70:rgb(201 188 168/.70); --sand-30:rgb(201 188 168/.30); --sand-14:rgb(201 188 168/.14);
  --steel:#8FA4B4; --steel-55:rgb(143 164 180/.55); --steel-30:rgb(143 164 180/.30); --steel-14:rgb(143 164 180/.14);
  --grot:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);overflow:hidden}
body{font-family:var(--grot);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.stage{position:fixed;inset:0;background:var(--ground);isolation:isolate}
.mount{position:absolute;inset:0}
.compound__svg{width:100%;height:100%;display:block;overflow:hidden}
.compound__gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
/* THE MODEL IS THE BUTTON. Every building answers the pointer, so the cursor has to say
   so on the mass itself rather than on a tag hovering above it. */
.stage[data-hot='true'] .compound__gl{cursor:pointer}
.stage[data-gl='on'] .compound__svg{visibility:hidden}
.cal{display:none}
/* a very light top scrim only — the sky behind the model is now doing this work */
.stage::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,rgb(6 7 8/.42) 0%,rgb(6 7 8/0) 13%),
             linear-gradient(to top,rgb(6 7 8/.72) 0%,rgb(6 7 8/.26) 13%,rgb(6 7 8/0) 30%)}
.mark{position:absolute;z-index:6;top:var(--s6);left:var(--s7);display:grid;gap:var(--s1);pointer-events:none}
.mark b{font-size:15px;font-weight:600;letter-spacing:.10em;text-transform:uppercase}
.mark span{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}

/* ---- THE BUILDING TAG -----------------------------------------------------------------
   A label, not a control. pointer-events:none is the whole point: it sits over the canvas
   and the canvas keeps the pointer, so the building underneath stays hovered and stays
   clickable no matter where the tag lands. Small, grounded on a hairline stem, and it
   answers the three questions in order — which building, how much of it is left, what
   happens if I click. */
#tag{position:absolute;z-index:5;transform:translate(-50%,0);pointer-events:none;
  background:var(--sand);color:var(--void);box-shadow:0 0 0 1px rgb(0 0 0/.4),0 10px 26px rgb(0 0 0/.36)}
#tag[data-s='on']{background:var(--red);color:#fff}
#tag .n{display:flex;align-items:baseline;gap:7px;padding:5px 9px 3px;font-size:17px;font-weight:600;line-height:1;letter-spacing:-.02em}
#tag .n i{font-style:normal;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.04em;opacity:.72}
#tag .go{display:block;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;
  padding:4px 9px 3px;border-top:1px solid rgb(0 0 0/.26);background:rgb(0 0 0/.13)}
#tag::after{content:'';position:absolute;left:50%;bottom:-10px;width:1px;height:10px;background:var(--sand)}
#tag[data-s='on']::after{background:var(--red)}

/* ---- GLOBAL NAVIGATION — one convention, top right ------------------------------------ */
.nav{position:absolute;z-index:8;top:var(--s6);right:var(--s7);display:flex;gap:var(--s3)}
.nav button{appearance:none;cursor:pointer;background:rgb(8 9 11/.78);border:1px solid var(--ink-40);color:var(--ink);
  font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  padding:10px 16px 9px;transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
.nav button:hover{background:var(--ink);color:var(--void);border-color:var(--ink)}
.nav .ctx{background:none;border-color:var(--ink-24);color:var(--ink-70)}
.nav .ctx:hover{background:var(--ink-16);border-color:var(--ink-55);color:var(--ink)}

/* ---- THE DECISION DOCK ----------------------------------------------------------------- */
.dock{position:absolute;z-index:7;bottom:var(--s6);left:var(--s7);right:var(--s7);
  background:linear-gradient(to bottom,rgb(13 16 20/.97),rgb(9 11 14/.97));
  border:1px solid var(--ink-24);backdrop-filter:blur(8px);
  display:grid;grid-template-columns:minmax(190px,auto) 1fr auto;align-items:stretch}
.dock[data-level='compound']{right:auto;grid-template-columns:auto}
.dock::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--red)}
.cell{padding:var(--s4) var(--s5);min-width:0}
.cell + .cell{border-left:1px solid var(--ink-16)}

.who__k{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-55)}
.who__f{font-size:36px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:7px 0 5px;white-space:nowrap}
.who__s{font-size:15px;color:var(--ink-85)} .who__s b{color:var(--ink);font-weight:500}
.tell{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:7px}
.tell--go{color:var(--sand)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:14px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;padding:3px 9px 2px;margin-top:var(--s2)}
.chip--a{color:var(--void);background:var(--sand)}
.chip--b{color:var(--steel);border:1px solid var(--steel-55)}
/* the quiet secondary at compound: a utility, never competing with CHOOSE A BUILDING */
.plink{appearance:none;background:none;border:0;padding:0;margin-top:var(--s4);cursor:pointer;
  font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-55);border-bottom:1px solid var(--ink-24);line-height:1.5}
.plink:hover{color:var(--ink);border-color:var(--ink-55)}

/* ---- MINIATURE GARAGE BAYS -------------------------------------------------------------
   Each one is a drawn garage unit: head, glazed upper panel, segmented door leaf, apron.
   Width comes from the model, so premium is visibly the wider unit before anything is
   hovered. Height NEVER changes — state is carried by value and colour. */
.bayswrap{display:flex;flex-direction:column;justify-content:center;gap:var(--s2);padding:var(--s4) var(--s5);overflow:hidden}
.bayhead{display:flex;align-items:baseline;gap:var(--s4);font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-55)}
.bayhead em{font-style:normal;color:var(--ink-70)}
.bayhead i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.bayhead i::before{content:'';width:13px;height:9px;background:var(--sand);display:inline-block}
.bayhead i.b::before{background:none;border:1px solid var(--steel-55)}
.bayhead i.s::before{background:none;border:1px solid var(--ink-16)}
.bays{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:visible;padding-top:26px;scrollbar-width:none}
.bays::-webkit-scrollbar{height:0}
.bay{appearance:none;flex:0 0 auto;padding:0;position:relative;cursor:pointer;height:52px;
  background:var(--steel-14);border:0;border-top:2px solid var(--steel-55);
  transition:background-color .16s var(--ease),border-color .16s var(--ease)}
/* the glazed upper panel */
.bay::before{content:'';position:absolute;left:2px;right:2px;top:5px;height:9px;background:var(--steel-30);
  transition:background-color .16s var(--ease)}
/* the door leaf, with its own segment lines */
.bay::after{content:'';position:absolute;left:2px;right:2px;top:17px;bottom:4px;
  background:repeating-linear-gradient(to bottom,var(--steel-30) 0 6px,rgb(0 0 0/.30) 6px 7px);
  transition:background .16s var(--ease)}
.bay[data-type='A']{border-top-color:var(--sand-70)}
.bay:hover,.bay[data-hot='true']{background:var(--sand-14);border-top-color:var(--sand)}
.bay:hover::before,.bay[data-hot='true']::before{background:var(--sand)}
.bay:hover::after,.bay[data-hot='true']::after{background:repeating-linear-gradient(to bottom,var(--sand-70) 0 6px,rgb(0 0 0/.32) 6px 7px)}
.bay[data-sold='true']{cursor:not-allowed;background:none;border-top-color:var(--ink-16)}
.bay[data-sold='true']::before{background:var(--ink-10)}
.bay[data-sold='true']::after{background:repeating-linear-gradient(135deg,var(--ink-10) 0 3px,transparent 3px 7px)}
.bay[aria-pressed='true']{background:var(--red-16);border-top-color:var(--red)}
.bay[aria-pressed='true']::before{background:#fff}
.bay[aria-pressed='true']::after{background:repeating-linear-gradient(to bottom,var(--red) 0 6px,rgb(0 0 0/.34) 6px 7px)}
.bay__t{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;opacity:0;pointer-events:none;
  font-family:var(--mono);font-size:14px;font-weight:500;color:var(--void);background:var(--sand);
  padding:2px 7px 1px;transition:opacity .13s var(--ease)}
.bay:hover .bay__t,.bay[data-hot='true'] .bay__t{opacity:1}
.bay[aria-pressed='true'] .bay__t{opacity:1;color:#fff;background:var(--red)}
.bay[data-sold='true'] .bay__t{background:var(--ink-24);color:var(--ink)}

/* ---- THE RIGHT CELL: the product, and the next action --------------------------------- */
.right{display:flex;align-items:center;gap:var(--s5);padding:var(--s4) var(--s5)}
.price{display:grid;gap:2px;white-space:nowrap}
.price .k{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.price .v{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.price .a{font-size:15px;color:var(--ink-70)}
.next{display:grid;gap:3px;white-space:nowrap;max-width:250px}
.next .k{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.next .v{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:normal}
.next .a{font-size:15px;color:var(--ink-55);white-space:normal}
/* ENTER — rectangular, architectural, and the only saturated surface on the screen */
.enter{appearance:none;cursor:pointer;display:grid;grid-template-columns:auto 56px;align-items:stretch;
  border:0;padding:0;font:inherit;background:var(--red);color:#fff;
  box-shadow:0 0 0 1px var(--red-40),0 14px 34px rgb(216 69 60/.20);
  transition:filter .18s var(--ease),box-shadow .18s var(--ease)}
.enter:hover{filter:brightness(1.1);box-shadow:0 0 0 1px var(--red),0 16px 40px rgb(216 69 60/.32)}
.enter:active{filter:brightness(.96)}
.enter .t{padding:17px var(--s5) 16px;text-align:left;font-size:19px;font-weight:600;letter-spacing:-.005em}
.enter .t i{display:block;font-style:normal;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.76;margin-bottom:3px}
.enter .a{display:flex;align-items:center;justify-content:center;font-size:22px;border-left:1px solid rgb(255 255 255/.28)}

/* ---- SITE PLAN -------------------------------------------------------------------------- */
.plan{position:fixed;inset:0;z-index:30;background:var(--panel2);display:grid;grid-template-rows:auto 1fr}
.plan__bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s6);padding:var(--s4) var(--s7);border-bottom:1px solid var(--ink-24)}
.plan__exit{appearance:none;cursor:pointer;background:var(--ink);border:0;color:var(--void);
  font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:11px 18px 10px}
.plan__exit:hover{background:#fff}
.plan__t{display:flex;align-items:baseline;gap:var(--s4)}
.plan__t b{font-size:19px;font-weight:600} .plan__t span{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.plan__key{display:flex;gap:var(--s5);font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}
.plan__key i{display:inline-block;width:22px;height:9px;margin-right:7px;font-style:normal}
.plan__grid{position:relative;display:grid;grid-template-columns:1fr 300px;overflow:hidden}
.plan__map{position:relative;overflow:hidden}
.plan__list{border-left:1px solid var(--ink-16);padding:var(--s5) var(--s6);overflow:auto}
.plan__list h4{margin:0 0 var(--s4);font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:baseline;width:100%;text-align:left;
  padding:11px 0;border:0;border-bottom:1px solid var(--ink-10);background:none;color:inherit;font:inherit;cursor:pointer}
.prow:hover{color:var(--sand)}
.prow b{font-family:var(--mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.prow span{font-size:15px;color:var(--ink-55)} .prow em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--ink-70)}
.plan__map svg{width:100%;height:100%;display:block;visibility:visible}
.plan__map .perimeter{fill:none;stroke:var(--ink-24);stroke-width:1.4;vector-effect:non-scaling-stroke}
.plan__map .mass-road-trace,.plan__map .compound__road{fill:#141a20;stroke:none}
.plan__map .mass-road-line{fill:none;stroke:var(--ink-16);stroke-width:1;vector-effect:non-scaling-stroke}
.plan__map .mass-run,.plan__map .mass-side{fill:#1b2129;stroke:var(--ink-16);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .mass-civic{fill:#2a323b;stroke:var(--ink-24);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .bay{stroke:rgb(10 12 15/.9);stroke-width:.6;vector-effect:non-scaling-stroke}
.plan__map .bay[data-type='A']{fill:var(--sand-70)}
.plan__map .bay[data-type='B']{fill:var(--steel-55)}
.plan__map .bay[data-sold='true']{fill:none;stroke:var(--ink-24)}
.plan__map .door{fill:none;stroke:var(--ink-40);stroke-width:.8;vector-effect:non-scaling-stroke}
.plan__map .leader,.plan__map .route{display:none}
.plan__map .pnum{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500;paint-order:stroke;stroke:rgb(6 7 8/.85);stroke-width:4px}

/* a short stage keeps the dock and the model apart at laptop heights */
@media (max-height:880px){
  .dock{bottom:var(--s5);left:var(--s6);right:var(--s6)}
  .who__f{font-size:31px} .bay{height:46px} .enter .t{padding:14px var(--s5) 13px;font-size:18px}
  .mark{top:var(--s5);left:var(--s6)} .nav{top:var(--s5);right:var(--s6)}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mount" id="mount"></div>
  <div id="tag" hidden></div>

  <div class="mark"><b>Luxe&nbsp;Corsa</b><span>Lake Zurich, Illinois</span></div>
  <div class="nav">
    <button class="ctx" id="ctxBack" type="button" hidden></button>
    <button id="overview" type="button" hidden>← Overview</button>
  </div>

  <div class="dock" id="dock" data-level="compound">
    <div class="cell" id="cellWho">
      <div class="who__k" id="whoK">Luxe Corsa</div>
      <div class="who__f" id="whoF">121</div>
      <div class="who__s" id="whoS">private suites · 11 buildings</div>
      <div class="tell" id="tell">Choose a building.</div>
      <button class="plink" id="planBtn" type="button">Site plan</button>
    </div>
    <div class="cell bayswrap" id="cellBays" hidden>
      <div class="bayhead" id="bayHead"></div>
      <div class="bays" id="bays" role="group" aria-label="Suites in this building"></div>
    </div>
    <div class="cell right" id="cellRight" hidden></div>
  </div>
</div>

<div class="plan" id="plan" hidden>
  <div class="plan__bar">
    <button class="plan__exit" id="planExit" type="button">← Back to 3D</button>
    <div class="plan__t"><b>Site plan</b><span>11 buildings · 121 suites</span></div>
    <div class="plan__key">
      <span><i style="background:var(--sand)"></i>Premium — Type A</span>
      <span><i style="background:var(--steel-55)"></i>Standard — Type B</span>
      <span><i style="background:var(--ink-10)"></i>Sold</span>
    </div>
  </div>
  <div class="plan__grid"><div class="plan__map" id="planMap"></div><div class="plan__list" id="planList"><h4>Buildings</h4></div></div>
</div>

<script type="module">
import { buildCompound, TYPE_SPEC } from '/src/site/compound.js'
const $ = (id) => document.getElementById(id)
const stage=$('stage'), mount=$('mount'), dock=$('dock')
const compound = buildCompound(mount)
let gl=null, THREE=null
const S = { level:'compound', building:null, suite:null, hover:null, hoverSuite:null, plan:false, entered:false }
const TOTAL = compound.suites.length
const AVAILABLE = compound.suites.filter(s=>!s.sold).length
const say = v => String(v).replace(/\bSQ FT\b/g,'sq ft').replace(/\bTYPE\b/g,'Type').replace(/\bFROM\b/g,'from')
const kind = t => t==='A' ? 'Premium' : 'Standard'

function hoverBuilding(b){ if(S.hover===b) return; S.hover=b; gl?.setHoverBuilding(b?b.num:null)
  stage.dataset.hot = b && !S.building ? 'true' : 'false'; paint() }
function hoverSuite(s){ if(S.hoverSuite===s) return; S.hoverSuite=s; gl?.setHoverSuite(s||null); paint() }
function selectBuilding(b){ if(!b) return
  Object.assign(S,{building:b,suite:null,hover:null,hoverSuite:null,level:'building',entered:false})
  stage.dataset.hot='false'; gl?.setLevel('building',b.num); renderBays(); paint() }
function selectSuite(s){ if(!s||s.sold) return
  Object.assign(S,{suite:s,building:s.bldg,hoverSuite:null,level:'suite',entered:false})
  gl?.setLevel('suite',s.bldg.num,s.index); paint() }
/* THE GLOBAL ESCAPE. One action, one place, and it always means the same thing. */
function overview(){ Object.assign(S,{level:'compound',building:null,suite:null,hover:null,hoverSuite:null,entered:false})
  stage.dataset.hot='false'; gl?.setLevel('compound'); paint() }
/* the contextual step back, which is never the only way out */
function backToBuilding(){ if(S.level!=='suite'||!S.building) return overview()
  const b=S.building; Object.assign(S,{suite:null,level:'building',entered:false})
  gl?.setLevel('building',b.num); paint() }
/* ENTER. The commitment, and the handover: the camera goes to the door and the page
   announces it, so a host page can take the visitor on into the suite itself. */
function enterSuite(){ if(!S.suite) return
  S.entered=true
  gl?.enterSuite(S.suite.index)
  paint()
  dispatchEvent(new CustomEvent('luxe:enter',{detail:{ref:S.suite.ref,type:S.suite.type,building:S.building.num}}))
}

/* ======================================================================================
   THE BUILDING TAG.  A label over the subject that never takes the pointer.
   ====================================================================================== */
const tag=$('tag')
const anchors = new Map()   /* num -> the roof corners, in site-local space */
function buildAnchors(){
  for(const b of compound.buildings){
    const runs = new Map()
    for(const s of b.suites){ const k=s.ang.toFixed(2); if(!runs.has(k)) runs.set(k,[]); runs.get(k).push(s) }
    const pts=[]
    for(const list of runs.values()){
      const r=-(list[0].ang*Math.PI)/180, ux=Math.cos(r), uz=-Math.sin(r)
      const proj=list.map(s=>({s,u:s.cx*ux+s.cy*uz})).sort((a,b)=>a.u-b.u)
      const first=proj[0].s, last=proj[proj.length-1].s
      const halfA=(first.slot??first.w)/2, halfB=(last.slot??last.w)/2
      const d=(first.depth??first.dep)/2
      const nx=first.faceNormal[0], nz=first.faceNormal[1]
      const x0=first.cx-ux*halfA, z0=first.cy-uz*halfA
      const x1=last.cx+ux*halfB,  z1=last.cy+uz*halfB
      pts.push([x0+nx*d,z0+nz*d],[x1+nx*d,z1+nz*d],[x1-nx*d,z1-nz*d],[x0-nx*d,z0-nz*d])
    }
    anchors.set(b.num,pts)
  }
}
function drawTag(){
  const subject = S.suite ? null : (S.building || S.hover)
  if(!gl||!subject||!anchors.size||S.plan){ tag.hidden=true; return }
  const pts=anchors.get(subject.num); if(!pts){ tag.hidden=true; return }
  const H = gl.roofY ?? 0
  const w=innerWidth, h=innerHeight
  const v=new THREE.Vector3()
  let top=1e9, topX=0, behind=false
  for(const [x,z] of pts){
    v.set(x,H,z); gl.site.localToWorld(v); v.project(gl.camera)
    if(v.z>1){ behind=true; break }
    const px=(v.x*.5+.5)*w, py=(-v.y*.5+.5)*h
    if(py<top){ top=py; topX=px }
  }
  if(behind){ tag.hidden=true; return }
  const on=!!S.building
  tag.dataset.s = on?'on':'hover'
  tag.style.left=Math.max(96,Math.min(w-110,topX))+'px'
  tag.style.top=Math.max(64,top-74)+'px'
  tag.innerHTML=`<span class="n">${subject.num}<i>${subject.open} of ${subject.suites.length} available</i></span>`
    +(on?'':'<span class="go">Click to view →</span>')
  tag.hidden=false
}

/* ======================================================================================
   MINIATURE BAYS — garage units at the model's own width ratio.
   ====================================================================================== */
const baysEl=$('bays'), bayHead=$('bayHead')
function renderBays(){
  baysEl.replaceChildren()
  const list=S.building?.suites||[]
  const widest=Math.max(...list.map(s=>s.slot??s.w))
  const nA=list.filter(s=>s.type==='A').length
  const nSold=list.filter(s=>s.sold).length
  bayHead.innerHTML=`<em>Suites</em><i>${nA} premium</i><i class="b">${list.length-nA} standard</i>`
    +(nSold?`<i class="s">${nSold} sold</i>`:'')
  for(const s of list){
    const b=document.createElement('button')
    b.type='button'; b.className='bay'; b.dataset.sold=s.sold?'true':'false'; b.dataset.type=s.type
    /* WIDTH COMES FROM THE MODEL: a premium bay is 30:23 wider in the building, so it is
       30:23 wider here. Nothing about premium is asserted; it is measured. */
    b.style.width=Math.round(22+((s.slot??s.w)/widest)*15)+'px'
    b.disabled = s.sold
    b.setAttribute('aria-label',`Suite ${s.ref}, ${kind(s.type)} Type ${s.type}${s.sold?', sold':', available'}`)
    b.innerHTML=`<span class="bay__t">${s.ordinal} · ${s.sold?'Sold':kind(s.type)}</span>`
    b.addEventListener('pointerenter',()=>hoverSuite(s))
    b.addEventListener('pointerleave',()=>hoverSuite(null))
    b.addEventListener('focus',()=>hoverSuite(s))
    b.addEventListener('blur',()=>hoverSuite(null))
    b.addEventListener('click',()=>selectSuite(s))
    b._s=s; baysEl.appendChild(b)
  }
}

/* ====================================================================================== */
const whoK=$('whoK'),whoF=$('whoF'),whoS=$('whoS'),tell=$('tell')
const cellBays=$('cellBays'),cellRight=$('cellRight'),ov=$('overview'),ctx=$('ctxBack'),planBtn=$('planBtn')
const chip = t => `<span class="chip chip--${t.toLowerCase()}">${kind(t)} · Type ${t}</span>`

function paint(){
  dock.dataset.level=S.level
  const b=S.building, s=S.suite
  ov.hidden = S.level==='compound'
  ctx.hidden = S.level!=='suite'
  if(S.level==='suite'&&b) ctx.textContent='← Building '+b.num
  planBtn.hidden = S.level!=='compound'
  cellBays.hidden = S.level==='compound'
  cellRight.hidden = S.level==='compound'

  if(S.level==='suite'&&s){
    const t=TYPE_SPEC[s.type]
    whoK.textContent='Suite'; whoF.textContent=s.ref
    whoS.innerHTML=`Building ${b.num} · <b>available</b>`
    tell.innerHTML=chip(s.type)
    cellRight.innerHTML = S.entered
      ? `<div class="price"><span class="k">${say(t.total)}</span><span class="v">${t.price.replace('FROM ','')}</span><span class="a">${t.capacity.toLowerCase()}</span></div>
         <button class="enter" type="button" data-go><span class="t"><i>You are in</i>Continue to the suite</span><span class="a">↓</span></button>`
      : `<div class="price"><span class="k">${say(t.total)}</span><span class="v">${t.price.replace('FROM ','')}</span><span class="a">${t.footprint} · ${t.capacity.toLowerCase()}</span></div>
         <button class="enter" type="button" data-enter><span class="t"><i>Next</i>Enter suite ${s.ref}</span><span class="a">→</span></button>`
  } else if(S.level==='building'&&b){
    const hs=S.hoverSuite
    whoK.textContent='Building'; whoF.textContent=b.num
    whoS.innerHTML=`${b.suites.length} suites · <b>${b.open} available</b>`
    tell.innerHTML = hs ? `${hs.ordinal} — ${chip(hs.type)}` : '<span class="tell--go">Choose a suite.</span>'
    cellRight.innerHTML = hs
      ? `<div class="price"><span class="k">${kind(hs.type)} · Type ${hs.type}</span><span class="v">${TYPE_SPEC[hs.type].price.replace('FROM ','')}</span><span class="a">${say(TYPE_SPEC[hs.type].total)} · ${TYPE_SPEC[hs.type].footprint}</span></div>`
      : `<div class="next"><span class="k">Next</span><span class="v">Pick a suite below</span><span class="a">Each bay is one garage suite. Its real door lights up on the model.</span></div>`
  } else {
    const h=S.hover
    whoK.textContent = h ? 'Building' : 'Luxe Corsa'
    whoF.textContent = h ? h.num : String(TOTAL)
    whoS.innerHTML = h
      ? `${h.suites.length} suites · <b>${h.open} available</b>`
      : `private suites · 11 buildings · <b>${AVAILABLE} available</b>`
    tell.innerHTML = h ? '<span class="tell--go">Click to view it.</span>' : 'Choose a building.'
  }
  for(const el of baysEl.children){
    el.setAttribute('aria-pressed',el._s===s?'true':'false')
    if(el._s===S.hoverSuite&&el._s!==s) el.setAttribute('data-hot','true'); else el.removeAttribute('data-hot')
  }
  drawTag()
}
ov.addEventListener('click',overview)
ctx.addEventListener('click',backToBuilding)
cellRight.addEventListener('click',e=>{
  if(e.target.closest('[data-enter]')) enterSuite()
  else if(e.target.closest('[data-go]')) dispatchEvent(new CustomEvent('luxe:continue',{detail:{ref:S.suite?.ref}}))
})
addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(S.plan) closePlan(); else if(S.level!=='compound') overview() })

/* ---- SITE PLAN --------------------------------------------------------------------- */
const planEl=$('plan'),planMap=$('planMap'),planList=$('planList'); let planBuilt=false, planSvg=null
function fitPlan(){
  if(!planSvg) return
  try{
    const bb=planSvg.getBBox()
    if(!bb.width||!bb.height) return
    const m=Math.max(bb.width,bb.height)*0.05
    planSvg.setAttribute('viewBox',(bb.x-m)+' '+(bb.y-m)+' '+(bb.width+m*2)+' '+(bb.height+m*2))
  }catch(e){}
}
function buildPlan(){ if(planBuilt) return; planBuilt=true
  planSvg=compound.svg.cloneNode(true)
  planSvg.style.width='100%'; planSvg.style.height='100%'; planSvg.style.visibility='visible'
  planSvg.setAttribute('preserveAspectRatio','xMidYMid meet')
  planMap.appendChild(planSvg)
  const NS='http://www.w3.org/2000/svg'
  for(const b of compound.buildings){
    const src=planSvg.querySelector('g[data-building="'+b.num+'"]')
    if(src){ const bb=src.getBBox(); const t=document.createElementNS(NS,'text')
      t.textContent=b.num; t.setAttribute('x',bb.x+bb.width/2); t.setAttribute('y',bb.y+bb.height/2)
      t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle'); t.setAttribute('class','pnum')
      planSvg.appendChild(t) }
    const row=document.createElement('button'); row.type='button'; row.className='prow'
    const a=b.suites.filter(x=>x.type==='A').length
    row.innerHTML=`<b>${b.num}</b><span>${b.suites.length} suites${a?` · ${a} premium`:''}</span><em>${b.open} free</em>`
    row.addEventListener('click',()=>{ closePlan(); selectBuilding(b) })
    planList.appendChild(row)
  }
}
/* FIT TO VIEW ON EVERY OPEN. The panel has no size while hidden, so a viewBox solved at
   build time is solved against a zero box. It is re-solved after the panel is laid out,
   every time it opens — which is what makes the whole site visible with no initial pan. */
function openPlan(){ buildPlan(); S.plan=true; planEl.hidden=false; drawTag()
  requestAnimationFrame(()=>requestAnimationFrame(fitPlan)) }
function closePlan(){ S.plan=false; planEl.hidden=true; paint() }
planBtn.addEventListener('click',openPlan)
$('planExit').addEventListener('click',closePlan)
addEventListener('resize',()=>{ if(S.plan) fitPlan() })

/* ---- THE MODEL ---------------------------------------------------------------------- */
import('/src/site/compound3d.js').then(async ({ initCompound3D })=>{
  gl=initCompound3D(mount,compound); if(!gl) throw new Error('no webgl')
  stage.setAttribute('data-gl','on')
  THREE=await import('three')
  const bldgOf=n=>compound.byNum.get(n)
  gl.onHoverBuilding=n=>hoverBuilding(n?bldgOf(n):null)
  gl.onHoverSuite=i=>hoverSuite(i==null?null:compound.suites[i])
  gl.onPickBuilding=n=>{ const b=bldgOf(n); if(b) selectBuilding(b) }
  gl.onPickSuite=i=>{ const s=compound.suites[i]; if(s) selectSuite(s) }
  buildAnchors()
  let hi=0; gl.site.traverse(o=>{ if(o.isMesh&&o.userData?.kind==='suite'){
    const bb=new THREE.Box3().setFromObject(o); if(bb.max.y>hi) hi=bb.max.y } })
  gl.roofY = hi / (gl.site.scale.y || 1)
  window.__v5={S,compound,selectBuilding,selectSuite,hoverBuilding,hoverSuite,overview,backToBuilding,enterSuite,openPlan,closePlan,gl,THREE}
  const tick=()=>{ requestAnimationFrame(tick); drawTag() }
  requestAnimationFrame(()=>{ gl.setLevel('compound'); paint(); tick() })
}).catch(e=>console.warn('[v5] model did not stand',e))
paint()
</script>
